<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vocab Quest — Town Life</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:#1a1230;color:#f0ecff;min-height:100vh;padding:14px;overflow-x:hidden}
.wrap{max-width:720px;margin:0 auto}

.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#241640;border:2px solid #6c3fc5;border-radius:12px;padding:10px 16px;margin-bottom:12px;flex-wrap:wrap}
.hud-item{display:flex;flex-direction:column;align-items:center;min-width:60px}
.hud-lbl{font-size:10px;color:#a890e0;text-transform:uppercase;letter-spacing:.5px}
.hud-val{font-size:18px;font-weight:700}
.lives{font-size:18px;letter-spacing:1px}
.timer-big{font-size:22px;font-weight:700;color:#ffd95e}
.timer-big.low{color:#ff6b6b;animation:pulse .5s infinite}
@keyframes pulse{50%{opacity:.4}}

.card{background:#241640;border:2px solid #6c3fc5;border-radius:14px;padding:20px;margin-bottom:12px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 12px;border-radius:7px;margin-bottom:12px;letter-spacing:.5px;text-transform:uppercase}
.b-1{background:#1d4d6b;color:#9fd9f5}
.b-2{background:#1d5b3f;color:#8ee5b8}
.b-3{background:#5b4a1d;color:#f5d98e}
.b-4{background:#5b2d4a;color:#f0a8d0}
.b-5{background:#5b1d1d;color:#f5a8a8}

h2{font-size:20px;font-weight:700;margin-bottom:6px}
h3{font-size:16px;font-weight:600;margin-bottom:10px;line-height:1.4}
p.hint{font-size:13px;color:#a890e0;margin-bottom:14px;line-height:1.5}

.prog-wrap{height:8px;background:#160d28;border-radius:4px;margin-bottom:14px;overflow:hidden}
.prog-inner{height:100%;background:#9b7fe8;border-radius:4px;transition:width .4s}

/* Multiple choice / option buttons */
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.opt-grid.single{grid-template-columns:1fr}
.opt{background:#1a0f33;border:2px solid #6c3fc5;color:#f0ecff;border-radius:10px;padding:14px 16px;cursor:pointer;font-size:15px;text-align:left;transition:background .15s,border-color .15s;font-weight:500}
.opt:hover{background:#2d1a55;border-color:#9b7fe8}
.opt.correct{background:#14432a;border-color:#4ade80;color:#7ef0a8}
.opt.wrong{background:#42141a;border-color:#f87171;color:#ffa0a0}
.opt.disabled{pointer-events:none;opacity:.85}

/* Text input */
.text-inp{background:#160d28;border:2px solid #6c3fc5;color:#f0ecff;border-radius:10px;padding:12px 16px;font-size:17px;width:100%;max-width:360px;outline:none;margin-bottom:10px}
.text-inp:focus{border-color:#9b7fe8}
.text-inp.ok{border-color:#4ade80;background:#14432a}
.text-inp.bad{border-color:#f87171;background:#42141a}

.btn{background:#9b7fe8;color:#1a0f33;border:none;border-radius:10px;padding:12px 26px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .15s}
.btn:hover{transform:scale(1.04)}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn-go{background:#ffd95e;color:#3a2a00}

.feedback{font-size:14px;padding:10px 14px;border-radius:10px;margin-top:10px;display:none;font-weight:500}
.feedback.ok{background:#14432a;color:#7ef0a8;border:1px solid #4ade80}
.feedback.bad{background:#42141a;color:#ffa0a0;border:1px solid #f87171}

/* Image grid for picture matching */
.img-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.img-card{border:2px solid #6c3fc5;border-radius:12px;overflow:hidden;cursor:pointer;background:#1a0f33;transition:border-color .15s,transform .1s}
.img-card:hover{border-color:#9b7fe8;transform:translateY(-2px)}
.img-card.correct{border-color:#4ade80}
.img-card.wrong{border-color:#f87171}
.img-card.disabled{pointer-events:none}
.img-emoji{font-size:64px;text-align:center;padding:18px 0;background:#2d1a55}
.img-cap{font-size:14px;text-align:center;padding:10px;font-weight:600}

/* Word bank for sentence building */
.word-bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:#160d28;border:2px dashed #6c3fc5;border-radius:10px;min-height:48px;margin-bottom:10px}
.wtile{background:#3b2570;color:#f0ecff;border:2px solid #6c3fc5;border-radius:8px;padding:7px 14px;font-size:15px;cursor:pointer;transition:transform .1s;font-weight:500}
.wtile:hover{transform:translateY(-2px)}
.sent-tray{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:#1a0f33;border:2px solid #ffd95e;border-radius:10px;min-height:48px;margin-bottom:10px}
.ptile{background:#ffd95e;color:#3a2a00;border-radius:8px;padding:7px 14px;font-size:15px;cursor:pointer;font-weight:600}

/* Memory cards */
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.mem-card{aspect-ratio:1;background:#3b2570;border:2px solid #6c3fc5;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;text-align:center;padding:6px;transition:background .15s;font-weight:600;color:#f0ecff}
.mem-card.flipped{background:#2d1a55;border-color:#9b7fe8}
.mem-card.matched{background:#14432a;border-color:#4ade80;color:#7ef0a8;cursor:default}

/* Start & transition screens */
.center-screen{text-align:center;padding:28px 20px}
.big-emoji{font-size:60px;margin-bottom:12px;display:block}
.level-pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0}
.lpill{font-size:12px;padding:6px 12px;border-radius:20px;background:#1a0f33;border:1.5px solid #6c3fc5;color:#a890e0}
.name-inp{background:#160d28;border:2px solid #6c3fc5;color:#f0ecff;border-radius:10px;padding:12px 18px;font-size:16px;width:260px;outline:none;text-align:center;margin-bottom:18px;display:block;margin-left:auto;margin-right:auto}
.name-inp:focus{border-color:#9b7fe8}

/* Mario game */
#gameCanvasWrap{border:3px solid #6c3fc5;border-radius:12px;overflow:hidden;background:#5c94fc;margin-bottom:10px;position:relative}
#marioCanvas{display:block;width:100%;touch-action:none}
.mario-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.mctrl{background:#3b2570;border:2px solid #6c3fc5;border-radius:12px;padding:18px;font-size:24px;text-align:center;cursor:pointer;user-select:none;font-weight:700;color:#f0ecff}
.mctrl:active{background:#2d1a55}
.mario-hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:15px;font-weight:600}

.lb{background:#160d28;border:2px solid #6c3fc5;border-radius:12px;padding:16px;margin-top:14px}
.lb-head{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#a890e0;text-align:center;margin-bottom:10px}
.lb-row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-bottom:1px solid #241640;font-size:14px}
.lb-row:last-child{border-bottom:none}
.lb-row.me{background:#14432a;border-radius:8px}
.lb-rank{font-size:12px;font-weight:700;color:#ffd95e;min-width:28px}
.lb-name{flex:1}
.lb-sc{font-weight:700;color:#7ef0a8}

@media(max-width:480px){
  .opt-grid{grid-template-columns:1fr}
  .mem-grid{grid-template-columns:repeat(3,1fr)}
  .img-emoji{font-size:48px}
}
</style>
</head>
<body>
<div class="wrap">
<div id="root"></div>
</div>
<script>
/* ============ VOCABULARY DATA ============ */
const VOCAB=[
  {en:"smell",de:"riechen; der Geruch",emoji:"👃"},
  {en:"cooking",de:"das Kochen",emoji:"🍳"},
  {en:"boring",de:"langweilig",emoji:"😴"},
  {en:"clean",de:"sauber",emoji:"✨"},
  {en:"dirty",de:"schmutzig",emoji:"🧤"},
  {en:"unfriendly",de:"unfreundlich",emoji:"😠"},
  {en:"youth centre",de:"das Jugendzentrum",emoji:"🏛️"},
  {en:"field",de:"das Feld; die Weide",emoji:"🌾"},
  {en:"estate",de:"die Wohnsiedlung",emoji:"🏘️"},
  {en:"town",de:"die Stadt",emoji:"🏙️"},
  {en:"married",de:"verheiratet",emoji:"💍"},
  {en:"look after",de:"sich kümmern um",emoji:"🤱"},
  {en:"rubbish",de:"der Müll, der Abfall",emoji:"🗑️"},
  {en:"bin",de:"der Mülleimer",emoji:"🪣"},
  {en:"also",de:"auch",emoji:"➕"},
];

/* opposites & sentence data for harder levels */
const OPPOSITES=[
  {word:"clean",opp:"dirty"},
  {word:"friendly",opp:"unfriendly"},
  {word:"boring",opp:"interesting"},
];

const SENTENCES=[
  {words:["Jack","is","married","to","Jill."],answer:"Jack is married to Jill."},
  {words:["I","look","after","my","baby","sister."],answer:"I look after my baby sister."},
  {words:["Please","put","your","rubbish","in","the","bin."],answer:"Please put your rubbish in the bin."},
  {words:["The","horses","are","in","the","field."],answer:"The horses are in the field."},
  {words:["I","also","like","dancing."],answer:"I also like dancing."},
];

/* gap-fill sentences (level 4) */
const GAPS=[
  {sentence:"Please put your rubbish in the ___.",answer:"bin",options:["bin","field","town","estate"]},
  {sentence:"The horses are in the ___.",answer:"field",options:["field","bin","cooking","smell"]},
  {sentence:"Jack is ___ to Jill.",answer:"married",options:["married","boring","clean","also"]},
  {sentence:"I sometimes ___ my baby sister.",answer:"look after",options:["look after","smell","clean","also"]},
  {sentence:"Maths isn't ___! I think it's interesting.",answer:"boring",options:["boring","dirty","married","clean"]},
  {sentence:"We meet our friends at the ___.",answer:"youth centre",options:["youth centre","bin","field","rubbish"]},
];

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function sample(a,n){return shuffle(a).slice(0,n)}

/* ============ GLOBAL STATE ============ */
let state={
  name:"",
  level:1,
  lives:3,
  score:0,
  timeLeft:0,
  timerId:null,
  levelErrors:0,
  levelFailed:false,
};
const root=document.getElementById("root");

/* Max errors allowed per level before the level counts as "not passed" */
const MAX_ERRORS=2;

/* ============ HUD ============ */
function hud(){
  const hearts="❤️".repeat(state.lives)+"🖤".repeat(Math.max(0,3-state.lives));
  return `
  <div class="hud">
    <div class="hud-item"><span class="hud-lbl">Level</span><span class="hud-val">${state.level}/5</span></div>
    <div class="hud-item"><span class="hud-lbl">Leben</span><span class="lives">${hearts}</span></div>
    <div class="hud-item"><span class="hud-lbl">Punkte</span><span class="hud-val">${state.score}</span></div>
    <div class="hud-item"><span class="hud-lbl">Zeit</span><span class="timer-big ${state.timeLeft<=5?'low':''}" id="timerDisp">${state.timeLeft}s</span></div>
  </div>`;
}

function startTimer(seconds,onExpire){
  state.timeLeft=seconds;
  clearInterval(state.timerId);
  state.timerId=setInterval(()=>{
    state.timeLeft--;
    const t=document.getElementById("timerDisp");
    if(t){t.textContent=state.timeLeft+"s";if(state.timeLeft<=5)t.classList.add("low");}
    if(state.timeLeft<=0){clearInterval(state.timerId);onExpire();}
  },1000);
}
function stopTimer(){clearInterval(state.timerId);}

/* Register a mistake during the current level.
   No longer ends the game — only counts toward the level result. */
function registerError(){
  state.levelErrors++;
}

/* Run fn after delay, but only if we're still in the same level generation
   (prevents a stale answer-callback from firing after a timeout ended the level). */
function advance(fn,delay){
  const g=state.gen;
  setTimeout(()=>{ if(state.gen===g) fn(); },delay);
}

/* Called when a level's questions are all done (or time ran out).
   Decides whether the level was passed. Failing costs one life. */
function finishLevel(timedOut){
  stopTimer();
  state.gen=(state.gen||0)+1; // invalidate any pending question callbacks
  const failed = timedOut || state.levelErrors>MAX_ERRORS;
  if(failed && state.lives>0) state.lives--;
  state.levelFailed=failed;
  showLevelResult(failed,timedOut);
}

function showLevelResult(failed,timedOut){
  const info=LEVEL_INFO[state.level];
  const heart=failed?"💔":"💚";
  const headline=failed
    ? (timedOut?"Zeit abgelaufen!":"Level nicht geschafft")
    : "Level geschafft!";
  const detail=failed
    ? (timedOut
        ? "Die Zeit ist abgelaufen. Du verlierst ein Leben."
        : `Du hattest ${state.levelErrors} Fehler (mehr als ${MAX_ERRORS} erlaubt). Du verlierst ein Leben.`)
    : `Super! ${state.levelErrors===0?"Fehlerfrei! ":""}Du behältst deine Leben.`;
  root.innerHTML=hud()+`
  <div class="card">
    <div class="center-screen">
      <span class="big-emoji">${heart}</span>
      <span class="badge ${info.badge}">Level ${state.level} / 5</span>
      <h2>${headline}</h2>
      <p class="hint" style="max-width:420px;margin:10px auto 14px">${detail}</p>
      <p class="hint" style="font-size:14px">Aktuell: <strong>${state.lives} ❤️</strong> von 3 Leben</p>
      <button class="btn btn-go" onclick="nextLevel()">${state.level>=5?"Zum Jump-and-Run":"Nächstes Level"}</button>
    </div>
  </div>`;
}

/* ============ START SCREEN ============ */
function showStart(){
  stopTimer();
  root.innerHTML=`
  <div class="card">
    <div class="center-screen">
      <span class="big-emoji">🏙️</span>
      <h2>Vocab Quest: Town Life</h2>
      <p class="hint" style="font-size:14px;max-width:440px;margin:10px auto 0">
        5 Level. Jedes Level ein anderes Aufgabenformat — und jedes wird schwieriger.
        Du startest mit <strong>3 Leben ❤️</strong>. Schaffst du ein Level nicht
        (zu viele Fehler oder Zeit abgelaufen), verlierst du ein Leben.
        Spiel gegen die Zeit!
      </p>
      <div class="level-pills">
        <span class="lpill">1 · Wort → Bild</span>
        <span class="lpill">2 · Multiple Choice</span>
        <span class="lpill">3 · Memory</span>
        <span class="lpill">4 · Lückentext</span>
        <span class="lpill">5 · Satzbau</span>
      </div>
      <p class="hint" style="font-size:13px">🎮 Danach spielst du ein Jump-and-Run mit <strong>Ms Pältz</strong> — mit so vielen Leben, wie du behalten hast (0–3)!</p>
      <input class="name-inp" id="nameInp" placeholder="Dein Name" maxlength="16" />
      <button class="btn btn-go" onclick="beginGame()">🚀 Los geht's!</button>
    </div>
  </div>`;
}

function beginGame(){
  state.name=(document.getElementById("nameInp").value||"").trim()||"Player";
  state.level=1;state.lives=3;state.score=0;state.levelErrors=0;
  showLevelIntro();
}

/* ============ LEVEL INTRO ============ */
const LEVEL_INFO={
  1:{title:"Wort → Bild",emoji:"🖼️",desc:"Welches Bild passt zum englischen Wort? Tippe es an.",time:50,badge:"b-1"},
  2:{title:"Multiple Choice",emoji:"📝",desc:"Wähle die richtige deutsche Bedeutung. Vorsicht — die Ablenker sind gemein!",time:45,badge:"b-2"},
  3:{title:"Memory: Wort-Paare",emoji:"🧠",desc:"Finde die Paare: englisches Wort + deutsche Bedeutung.",time:60,badge:"b-3"},
  4:{title:"Lückentext",emoji:"✏️",desc:"Welches Wort fehlt im Satz? Wähle aus.",time:40,badge:"b-4"},
  5:{title:"Satzbau",emoji:"🏗️",desc:"Bring die Wörter in die richtige Reihenfolge. Das schwerste Level!",time:50,badge:"b-5"},
};

function showLevelIntro(){
  stopTimer();
  const info=LEVEL_INFO[state.level];
  root.innerHTML=hud()+`
  <div class="card">
    <div class="center-screen">
      <span class="big-emoji">${info.emoji}</span>
      <span class="badge ${info.badge}">Level ${state.level} / 5</span>
      <h2>${info.title}</h2>
      <p class="hint" style="max-width:420px;margin:10px auto 18px">${info.desc}</p>
      <p class="hint" style="font-size:13px">⏱️ Du hast ${info.time} Sekunden · max. ${MAX_ERRORS} Fehler erlaubt · ❤️ ${state.lives} Leben</p>
      <button class="btn btn-go" onclick="startLevel()">Level starten</button>
    </div>
  </div>`;
}

function startLevel(){
  state.levelErrors=0;
  state.levelFailed=false;
  state.gen=(state.gen||0)+1;
  if(state.level===1)level1();
  else if(state.level===2)level2();
  else if(state.level===3)level3();
  else if(state.level===4)level4();
  else if(state.level===5)level5();
}

function nextLevel(){
  state.level++;
  if(state.level>5){winQuiz();return;}
  showLevelIntro();
}

/* ============ LEVEL 1: Word → Picture ============ */
let l1={items:[],idx:0};
function level1(){
  l1.items=sample(VOCAB,6);l1.idx=0;
  startTimer(LEVEL_INFO[1].time,()=>timeUpLevel());
  renderL1();
}
function renderL1(){
  if(l1.idx>=l1.items.length){stopTimer();state.score+=20;finishLevel(false);return;}
  const target=l1.items[l1.idx];
  const distractors=sample(VOCAB.filter(v=>v.en!==target.en),3);
  const choices=shuffle([target,...distractors]);
  const cards=choices.map(c=>
    `<div class="img-card" onclick="pickL1('${c.en.replace(/'/g,"\\'")}','${target.en.replace(/'/g,"\\'")}',this)">
      <div class="img-emoji">${c.emoji}</div>
    </div>`).join("");
  root.innerHTML=hud()+`
  <div class="card">
    <span class="badge b-1">Level 1 · Wort → Bild · ${l1.idx+1}/${l1.items.length}</span>
    ${progBar(l1.idx,l1.items.length)}
    <h3>Welches Bild zeigt: <span style="color:#ffd95e">${target.en}</span>?</h3>
    <p class="hint">${target.de} · Fehler: ${state.levelErrors}/${MAX_ERRORS}</p>
    <div class="img-grid">${cards}</div>
    <div id="fb" class="feedback"></div>
  </div>`;
}
function pickL1(picked,correct,el){
  document.querySelectorAll(".img-card").forEach(c=>c.classList.add("disabled"));
  const ok=picked===correct;
  el.classList.add(ok?"correct":"wrong");
  const fb=document.getElementById("fb");fb.style.display="block";
  if(ok){
    state.score+=10;fb.className="feedback ok";fb.textContent="✅ Richtig! +10 Punkte";
    advance(()=>{l1.idx++;renderL1();},900);
  } else {
    registerError();
    fb.className="feedback bad";fb.textContent="❌ Falsch! Fehler "+state.levelErrors+" von "+MAX_ERRORS+".";
    advance(()=>{l1.idx++;renderL1();},1300);
  }
}

/* ============ LEVEL 2: Multiple Choice ============ */
let l2={items:[],idx:0};
function level2(){
  l2.items=sample(VOCAB,6);l2.idx=0;
  startTimer(LEVEL_INFO[2].time,()=>timeUpLevel());
  renderL2();
}
function renderL2(){
  if(l2.idx>=l2.items.length){stopTimer();state.score+=20;finishLevel(false);return;}
  const t=l2.items[l2.idx];
  const distractors=sample(VOCAB.filter(v=>v.en!==t.en),3).map(v=>v.de);
  const choices=shuffle([t.de,...distractors]);
  const opts=choices.map(c=>
    `<button class="opt" onclick="pickL2('${c.replace(/'/g,"\\'")}','${t.de.replace(/'/g,"\\'")}',this)">${c}</button>`).join("");
  root.innerHTML=hud()+`
  <div class="card">
    <span class="badge b-2">Level 2 · Multiple Choice · ${l2.idx+1}/${l2.items.length}</span>
    ${progBar(l2.idx,l2.items.length)}
    <h3>Was bedeutet <span style="color:#ffd95e">${t.en}</span> ${t.emoji}?</h3>
    <p class="hint">Wähle die richtige deutsche Übersetzung. · Fehler: ${state.levelErrors}/${MAX_ERRORS}</p>
    <div class="opt-grid">${opts}</div>
    <div id="fb" class="feedback"></div>
  </div>`;
}
function pickL2(picked,correct,el){
  document.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
  const ok=picked===correct;
  el.classList.add(ok?"correct":"wrong");
  if(!ok){document.querySelectorAll(".opt").forEach(o=>{if(o.textContent===correct)o.classList.add("correct");});}
  const fb=document.getElementById("fb");fb.style.display="block";
  if(ok){
    state.score+=10;fb.className="feedback ok";fb.textContent="✅ Richtig! +10 Punkte";
    advance(()=>{l2.idx++;renderL2();},900);
  } else {
    registerError();
    fb.className="feedback bad";fb.textContent="❌ Falsch! Richtig wäre: "+correct;
    advance(()=>{l2.idx++;renderL2();},1400);
  }
}

/* ============ LEVEL 3: Memory ============ */
let l3={cards:[],flipped:[],matched:0,total:0,lock:false};
function level3(){
  const pairs=sample(VOCAB,6);
  l3.total=pairs.length;l3.matched=0;l3.flipped=[];l3.lock=false;
  const cards=[];
  pairs.forEach((p,i)=>{
    cards.push({id:"e"+i,text:p.en,group:i,emoji:p.emoji});
    cards.push({id:"d"+i,text:p.de,group:i,emoji:""});
  });
  l3.cards=shuffle(cards);
  startTimer(LEVEL_INFO[3].time,()=>timeUpLevel());
  renderL3();
}
function renderL3(){
  const grid=l3.cards.map(c=>{
    const flipped=l3.flipped.find(f=>f.id===c.id);
    const matched=c.matched;
    const cls=matched?"matched":flipped?"flipped":"";
    const content=(matched||flipped)?(c.emoji?c.emoji+" "+c.text:c.text):"?";
    return `<div class="mem-card ${cls}" onclick="flipL3('${c.id}')">${content}</div>`;
  }).join("");
  root.innerHTML=hud()+`
  <div class="card">
    <span class="badge b-3">Level 3 · Memory · ${l3.matched}/${l3.total} Paare</span>
    ${progBar(l3.matched,l3.total)}
    <h3>Finde die Paare: englisches Wort + deutsche Bedeutung.</h3>
    <p class="hint">Tippe zwei Karten an. · Fehler: ${state.levelErrors}/${MAX_ERRORS}</p>
    <div class="mem-grid">${grid}</div>
    <div id="fb" class="feedback"></div>
  </div>`;
}
function flipL3(id){
  if(l3.lock)return;
  const card=l3.cards.find(c=>c.id===id);
  if(!card||card.matched||l3.flipped.find(f=>f.id===id))return;
  l3.flipped.push(card);
  renderL3();
  if(l3.flipped.length===2){
    l3.lock=true;
    const [a,b]=l3.flipped;
    const g=state.gen;
    if(a.group===b.group){
      setTimeout(()=>{
        if(state.gen!==g)return;
        l3.cards.forEach(c=>{if(c.group===a.group)c.matched=true;});
        l3.matched++;state.score+=10;l3.flipped=[];l3.lock=false;
        if(l3.matched===l3.total){stopTimer();state.score+=20;advance(()=>finishLevel(false),600);}
        else renderL3();
      },500);
    } else {
      const fb=document.getElementById("fb");
      setTimeout(()=>{
        if(state.gen!==g)return;
        l3.flipped=[];l3.lock=false;
        registerError();
        if(fb){fb.style.display="block";fb.className="feedback bad";fb.textContent="❌ Kein Paar! Fehler "+state.levelErrors+" von "+MAX_ERRORS+".";}
        renderL3();
      },800);
    }
  }
}

/* ============ LEVEL 4: Gap fill ============ */
let l4={items:[],idx:0};
function level4(){
  l4.items=sample(GAPS,6);l4.idx=0;
  startTimer(LEVEL_INFO[4].time,()=>timeUpLevel());
  renderL4();
}
function renderL4(){
  if(l4.idx>=l4.items.length){stopTimer();state.score+=25;finishLevel(false);return;}
  const g=l4.items[l4.idx];
  const opts=shuffle([...g.options]).map(o=>
    `<button class="opt" onclick="pickL4('${o.replace(/'/g,"\\'")}','${g.answer.replace(/'/g,"\\'")}',this)">${o}</button>`).join("");
  const sentenceHtml=g.sentence.replace("___",'<span style="color:#ffd95e;border-bottom:2px solid #ffd95e;padding:0 20px">?</span>');
  root.innerHTML=hud()+`
  <div class="card">
    <span class="badge b-4">Level 4 · Lückentext · ${l4.idx+1}/${l4.items.length}</span>
    ${progBar(l4.idx,l4.items.length)}
    <h3>${sentenceHtml}</h3>
    <p class="hint">Welches Wort passt in die Lücke? · Fehler: ${state.levelErrors}/${MAX_ERRORS}</p>
    <div class="opt-grid">${opts}</div>
    <div id="fb" class="feedback"></div>
  </div>`;
}
function pickL4(picked,correct,el){
  document.querySelectorAll(".opt").forEach(o=>o.classList.add("disabled"));
  const ok=picked===correct;
  el.classList.add(ok?"correct":"wrong");
  if(!ok){document.querySelectorAll(".opt").forEach(o=>{if(o.textContent===correct)o.classList.add("correct");});}
  const fb=document.getElementById("fb");fb.style.display="block";
  if(ok){
    state.score+=15;fb.className="feedback ok";fb.textContent="✅ Richtig! +15 Punkte";
    advance(()=>{l4.idx++;renderL4();},900);
  } else {
    registerError();
    fb.className="feedback bad";fb.textContent="❌ Falsch! Richtig: "+correct;
    advance(()=>{l4.idx++;renderL4();},1400);
  }
}

/* ============ LEVEL 5: Sentence building ============ */
let l5={items:[],idx:0,placed:[],remaining:[]};
function level5(){
  l5.items=sample(SENTENCES,5);l5.idx=0;
  startTimer(LEVEL_INFO[5].time,()=>timeUpLevel());
  loadL5();
}
function loadL5(){
  if(l5.idx>=l5.items.length){stopTimer();state.score+=30;finishLevel(false);return;}
  l5.placed=[];l5.remaining=shuffle([...l5.items[l5.idx].words]);
  renderL5();
}
function renderL5(){
  const bank=l5.remaining.map((w,i)=>`<span class="wtile" onclick="placeL5(${i})">${w}</span>`).join("");
  const tray=l5.placed.map((w,i)=>`<span class="ptile" onclick="unplaceL5(${i})">${w}</span>`).join("")
    ||'<span style="color:#6c3fc5;font-size:14px">Tippe Wörter, um den Satz zu bauen…</span>';
  root.innerHTML=hud()+`
  <div class="card">
    <span class="badge b-5">Level 5 · Satzbau · ${l5.idx+1}/${l5.items.length}</span>
    ${progBar(l5.idx,l5.items.length)}
    <h3>Bring die Wörter in die richtige Reihenfolge:</h3>
    <p class="hint">Tippe Wörter unten zum Hinzufügen, oben zum Entfernen. · Fehler: ${state.levelErrors}/${MAX_ERRORS}</p>
    <div class="sent-tray">${tray}</div>
    <div class="word-bank">${bank}</div>
    <button class="btn" onclick="checkL5()">✔ Prüfen</button>
    <div id="fb" class="feedback"></div>
  </div>`;
}
function placeL5(i){l5.placed.push(l5.remaining[i]);l5.remaining.splice(i,1);renderL5();}
function unplaceL5(i){l5.remaining.push(l5.placed[i]);l5.placed.splice(i,1);renderL5();}
function checkL5(){
  const ans=l5.placed.join(" ");
  const correct=l5.items[l5.idx].answer;
  const fb=document.getElementById("fb");fb.style.display="block";
  if(ans===correct){
    state.score+=20;fb.className="feedback ok";fb.textContent="✅ Perfekt! +20 Punkte";
    advance(()=>{l5.idx++;loadL5();},1000);
  } else {
    registerError();
    fb.className="feedback bad";fb.textContent="❌ Noch nicht richtig. Lösung: "+correct;
    advance(()=>{l5.idx++;loadL5();},1800);
  }
}

/* ============ MARIO-STYLE JUMP & RUN ============ */
/* Ms Pältz: woman with long blonde hair in a ponytail */
let mario=null;
function startMario(){
  root.innerHTML=`
  <div class="card">
    <div class="mario-hud">
      <span>🏃‍♀️ Ms Pältz</span>
      <span id="mLives">❤️ ${state.lives}</span>
      <span id="mCoins">🪙 0</span>
    </div>
    <div id="gameCanvasWrap">
      <canvas id="marioCanvas" width="640" height="360"></canvas>
    </div>
    <div class="mario-controls">
      <div class="mctrl" id="btnLeft">⬅️ Links</div>
      <div class="mctrl" id="btnRight">Rechts ➡️</div>
    </div>
    <div class="mctrl" id="btnJump" style="margin-bottom:10px">⬆️ SPRINGEN ⬆️</div>
    <p class="hint" style="text-align:center">Pfeiltasten/Leertaste am Computer · Buttons am iPad. Erreiche die Flagge 🚩!</p>
  </div>`;
  initMarioGame();
}

function initMarioGame(){
  const canvas=document.getElementById("marioCanvas");
  const ctx=canvas.getContext("2d");
  const W=canvas.width,H=canvas.height;

  const G=0.6, JUMP=-12, SPEED=3.2;
  let cameraX=0;

  const player={x:50,y:H-90,w:26,h:40,vx:0,vy:0,onGround:false,facing:1,lives:state.lives,coins:0,dead:false,win:false};

  // Level layout
  const platforms=[
    {x:0,y:H-40,w:900,h:40},
    {x:1000,y:H-40,w:1400,h:40},
    {x:300,y:H-120,w:90,h:16},
    {x:480,y:H-170,w:90,h:16},
    {x:660,y:H-130,w:90,h:16},
    {x:1100,y:H-120,w:100,h:16},
    {x:1320,y:H-180,w:100,h:16},
    {x:1560,y:H-130,w:100,h:16},
    {x:1820,y:H-160,w:120,h:16},
    {x:2050,y:H-110,w:100,h:16},
  ];
  const gaps=[{x:900,w:100}];
  const coins=[
    {x:330,y:H-160,got:false},{x:510,y:H-210,got:false},{x:690,y:H-170,got:false},
    {x:1130,y:H-160,got:false},{x:1350,y:H-220,got:false},{x:1590,y:H-170,got:false},
    {x:1860,y:H-200,got:false},{x:2080,y:H-150,got:false},
    {x:1200,y:H-70,got:false},{x:1700,y:H-70,got:false},
  ];
  const enemies=[
    {x:600,y:H-72,w:30,h:30,dir:-1,minX:520,maxX:760,alive:true},
    {x:1400,y:H-72,w:30,h:30,dir:1,minX:1300,maxX:1600,alive:true},
    {x:1950,y:H-72,w:30,h:30,dir:-1,minX:1820,maxX:2100,alive:true},
  ];
  const flag={x:2300,y:H-140,w:10,h:100};

  const keys={left:false,right:false,jump:false};

  // Keyboard
  function kd(e){
    if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
    if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
    if(e.key===" "||e.key==="ArrowUp"||e.key==="w"){keys.jump=true;e.preventDefault();}
  }
  function ku(e){
    if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
    if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
    if(e.key===" "||e.key==="ArrowUp"||e.key==="w")keys.jump=false;
  }
  document.addEventListener("keydown",kd);
  document.addEventListener("keyup",ku);

  // Touch buttons
  function bindBtn(id,key){
    const el=document.getElementById(id);
    const on=e=>{e.preventDefault();keys[key]=true;};
    const off=e=>{e.preventDefault();keys[key]=false;};
    el.addEventListener("touchstart",on,{passive:false});
    el.addEventListener("touchend",off,{passive:false});
    el.addEventListener("touchcancel",off,{passive:false});
    el.addEventListener("mousedown",on);
    el.addEventListener("mouseup",off);
    el.addEventListener("mouseleave",off);
  }
  bindBtn("btnLeft","left");bindBtn("btnRight","right");bindBtn("btnJump","jump");

  function respawn(){
    player.x=Math.max(50,cameraX+60);player.y=H-90;player.vx=0;player.vy=0;
  }

  function rectsOverlap(a,b){
    return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
  }

  function update(){
    if(player.dead||player.win)return;

    if(keys.left){player.vx=-SPEED;player.facing=-1;}
    else if(keys.right){player.vx=SPEED;player.facing=1;}
    else player.vx=0;

    if(keys.jump&&player.onGround){player.vy=JUMP;player.onGround=false;}

    player.vy+=G;
    player.x+=player.vx;
    player.y+=player.vy;

    player.onGround=false;
    platforms.forEach(pl=>{
      if(rectsOverlap(player,pl)){
        const prevBottom=player.y-player.vy+player.h;
        if(prevBottom<=pl.y+8&&player.vy>=0){
          player.y=pl.y-player.h;player.vy=0;player.onGround=true;
        } else if(player.vy<0&&player.y-player.vy>=pl.y+pl.h-8){
          player.y=pl.y+pl.h;player.vy=0;
        } else {
          if(player.vx>0)player.x=pl.x-player.w;
          else if(player.vx<0)player.x=pl.x+pl.w;
        }
      }
    });

    if(player.x<0)player.x=0;

    // Fall into gap / off bottom
    if(player.y>H+40){
      player.lives--;updateMarioHud();
      if(player.lives<=0){endMario(false);return;}
      respawn();
    }

    // Coins
    coins.forEach(c=>{
      if(!c.got&&Math.abs((player.x+player.w/2)-c.x)<22&&Math.abs((player.y+player.h/2)-c.y)<24){
        c.got=true;player.coins++;state.score+=5;updateMarioHud();
      }
    });

    // Enemies
    enemies.forEach(en=>{
      if(!en.alive)return;
      en.x+=en.dir*1.3;
      if(en.x<en.minX||en.x>en.maxX)en.dir*=-1;
      if(rectsOverlap(player,en)){
        if(player.vy>0&&(player.y+player.h-player.vy)<=en.y+8){
          en.alive=false;player.vy=JUMP*0.6;state.score+=10;updateMarioHud();
        } else {
          player.lives--;updateMarioHud();
          if(player.lives<=0){endMario(false);return;}
          respawn();
        }
      }
    });

    // Flag
    if(player.x+player.w>flag.x&&player.y+player.h>flag.y){
      endMario(true);return;
    }

    // Camera
    cameraX=Math.max(0,Math.min(player.x-W/3,2400-W));
  }

  function drawPaeltz(px,py){
    // Ms Pältz: woman, long blonde ponytail
    const x=px,y=py;
    // Ponytail (behind head)
    ctx.fillStyle="#f0c850";
    if(player.facing===1){
      ctx.beginPath();ctx.ellipse(x+4,y+10,6,11,0,0,Math.PI*2);ctx.fill();
    } else {
      ctx.beginPath();ctx.ellipse(x+player.w-4,y+10,6,11,0,0,Math.PI*2);ctx.fill();
    }
    // Legs
    ctx.fillStyle="#2d4a8a";
    ctx.fillRect(x+5,y+30,7,10);ctx.fillRect(x+14,y+30,7,10);
    // Body / shirt
    ctx.fillStyle="#e84a6f";
    ctx.fillRect(x+4,y+18,18,14);
    // Arms
    ctx.fillStyle="#f0b890";
    ctx.fillRect(x+1,y+19,4,9);ctx.fillRect(x+21,y+19,4,9);
    // Head
    ctx.fillStyle="#f6c9a0";
    ctx.beginPath();ctx.arc(x+13,y+11,9,0,Math.PI*2);ctx.fill();
    // Long blonde hair (top + sides)
    ctx.fillStyle="#f5cf5a";
    ctx.beginPath();ctx.arc(x+13,y+8,9,Math.PI,0);ctx.fill();
    ctx.fillRect(x+4,y+8,3,9);ctx.fillRect(x+19,y+8,3,9);
    // Hair tie
    ctx.fillStyle="#c89030";
    if(player.facing===1)ctx.fillRect(x+3,y+8,3,3);
    else ctx.fillRect(x+20,y+8,3,3);
    // Eyes
    ctx.fillStyle="#333";
    if(player.facing===1){ctx.fillRect(x+13,y+9,2,2);ctx.fillRect(x+17,y+9,2,2);}
    else{ctx.fillRect(x+7,y+9,2,2);ctx.fillRect(x+11,y+9,2,2);}
    // Smile
    ctx.strokeStyle="#a0506a";ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(x+13,y+13,3,0.1*Math.PI,0.9*Math.PI);ctx.stroke();
  }

  function draw(){
    // Sky
    ctx.fillStyle="#5c94fc";ctx.fillRect(0,0,W,H);
    // Clouds
    ctx.fillStyle="rgba(255,255,255,0.85)";
    for(let i=0;i<6;i++){
      const cx=((i*420)-cameraX*0.3)%2520;
      const ccx=cx<-100?cx+2520:cx;
      ctx.beginPath();ctx.arc(ccx,60,18,0,Math.PI*2);ctx.arc(ccx+20,60,22,0,Math.PI*2);ctx.arc(ccx+44,60,18,0,Math.PI*2);ctx.fill();
    }

    ctx.save();
    ctx.translate(-cameraX,0);

    // Ground & platforms
    platforms.forEach(pl=>{
      if(pl.h>=40){
        ctx.fillStyle="#7a4a1e";ctx.fillRect(pl.x,pl.y,pl.w,pl.h);
        ctx.fillStyle="#3aa84a";ctx.fillRect(pl.x,pl.y,pl.w,8);
      } else {
        ctx.fillStyle="#c84a1e";ctx.fillRect(pl.x,pl.y,pl.w,pl.h);
        ctx.fillStyle="#8a3010";ctx.fillRect(pl.x,pl.y+pl.h-4,pl.w,4);
      }
    });

    // Coins
    coins.forEach(c=>{
      if(c.got)return;
      ctx.fillStyle="#ffd700";ctx.beginPath();ctx.arc(c.x,c.y,9,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#e0a800";ctx.beginPath();ctx.arc(c.x,c.y,5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#fff";ctx.font="bold 9px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("€",c.x,c.y);
    });

    // Enemies (grumpy mushrooms)
    enemies.forEach(en=>{
      if(!en.alive)return;
      ctx.fillStyle="#8a2020";ctx.beginPath();ctx.arc(en.x+en.w/2,en.y+en.h/2,en.w/2,Math.PI,0);ctx.fill();
      ctx.fillRect(en.x,en.y+en.h/2,en.w,en.h/2);
      ctx.fillStyle="#fff";ctx.fillRect(en.x+6,en.y+16,6,7);ctx.fillRect(en.x+18,en.y+16,6,7);
      ctx.fillStyle="#000";ctx.fillRect(en.x+8,en.y+18,3,4);ctx.fillRect(en.x+20,en.y+18,3,4);
    });

    // Flag
    ctx.fillStyle="#888";ctx.fillRect(flag.x,flag.y,4,flag.h);
    ctx.fillStyle="#4ade80";ctx.beginPath();ctx.moveTo(flag.x+4,flag.y);ctx.lineTo(flag.x+34,flag.y+12);ctx.lineTo(flag.x+4,flag.y+24);ctx.fill();
    ctx.fillStyle="#fff";ctx.font="bold 11px sans-serif";ctx.fillText("ZIEL",flag.x+8,flag.y+8);

    // Player
    drawPaeltz(player.x,player.y);

    ctx.restore();
  }

  let raf;
  function loop(){
    update();
    draw();
    if(!player.dead&&!player.win)raf=requestAnimationFrame(loop);
  }
  loop();

  function updateMarioHud(){
    const l=document.getElementById("mLives"),c=document.getElementById("mCoins");
    if(l)l.textContent="❤️ "+Math.max(0,player.lives);
    if(c)c.textContent="🪙 "+player.coins;
  }

  function endMario(won){
    player.dead=!won;player.win=won;
    cancelAnimationFrame(raf);
    document.removeEventListener("keydown",kd);
    document.removeEventListener("keyup",ku);
    state.score+=won?100:0;
    finishMario(won,player.coins);
  }

  mario={endMario};
}

async function finishMario(won,coins){
  await saveScore();
  let entries=[];
  try{const r=await window.storage.get("vq_lb",true);if(r&&r.value)entries=JSON.parse(r.value);}catch(e){}
  const medals=["🥇","🥈","🥉"];
  const rows=entries.slice(0,10).map((e,i)=>{
    const me=e.name===state.name&&e.score===state.score;
    return `<div class="lb-row${me?" me":""}"><span class="lb-rank">${medals[i]||"#"+(i+1)}</span><span class="lb-name">${e.name}</span><span class="lb-sc">${e.score}</span></div>`;
  }).join("")||'<div style="text-align:center;color:#a890e0;font-size:13px">Noch keine Einträge.</div>';

  root.innerHTML=`
  <div class="card">
    <div class="center-screen">
      <span class="big-emoji">${won?"🏁":"💫"}</span>
      <h2>${won?"Ms Pältz hat das Ziel erreicht!":"Spiel vorbei!"}</h2>
      <p class="hint">${won?"Glückwunsch — du hast die Flagge erreicht! +100 Bonuspunkte.":"Ms Pältz hat alle Leben verbraucht. Aber tolle Leistung!"}</p>
      <p style="font-size:26px;font-weight:700;color:#ffd95e;margin:14px 0">${state.score} Punkte</p>
      <div class="lb">
        <div class="lb-head">🏆 Bestenliste</div>
        ${rows}
      </div>
      <button class="btn btn-go" onclick="showStart()" style="margin-top:16px">🔄 Nochmal spielen</button>
    </div>
  </div>`;
}

async function saveScore(){
  try{
    const key="vq_lb";
    let arr=[];
    try{const r=await window.storage.get(key,true);if(r&&r.value)arr=JSON.parse(r.value);}catch(e){}
    arr.push({name:state.name,score:state.score,date:Date.now()});
    arr.sort((a,b)=>b.score-a.score);
    arr=arr.slice(0,25);
    await window.storage.set(key,JSON.stringify(arr),true);
  }catch(e){}
}

/* fallback storage shim if window.storage missing (e.g. on GitHub Pages).
   Uses localStorage so the leaderboard persists on the device. */
if(typeof window.storage==="undefined"){
  window.storage={
    async get(k){
      try{const v=localStorage.getItem("vq_"+k);return v?{value:v}:null;}catch(e){return null;}
    },
    async set(k,v){
      try{localStorage.setItem("vq_"+k,v);}catch(e){}
      return{value:v};
    },
  };
}

showStart();
</script>
